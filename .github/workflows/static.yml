# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan tracked source for hardcoded secrets
        run: node scripts/check-secrets.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='scripts' \
            --exclude='package*.json' \
            --exclude='HARD_CODED_SECRETS.local.md' \
            --exclude='Sheekovic.github.io' \
            --exclude='_site' \
            ./ _site/
      - name: Render public browser configuration
        env:
          FIREBASE_SHEEKO_API_KEY: ${{ secrets.FIREBASE_SHEEKO_API_KEY }}
          FIREBASE_ACROSSBOARD_API_KEY: ${{ secrets.FIREBASE_ACROSSBOARD_API_KEY }}
        run: node scripts/render-public-config.mjs _site/assets/js/public-config.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
