<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Loan Calculator - Calculate Monthly Payments & Interest | Sheekovic</title>
    <meta name="description" content="Free loan calculator with amortization schedule. Calculate monthly payments, total interest, and payment breakdown. Perfect for mortgages, car loans, and personal loans.">
    <meta name="keywords" content="loan calculator, mortgage calculator, monthly payment calculator, amortization calculator, interest calculator, car loan calculator, personal loan calculator">
    <meta name="author" content="Sheekovic">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sheekovic.github.io/loan-calculator.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sheekovic.github.io/loan-calculator.html">
    <meta property="og:title" content="Free Loan Calculator - Calculate Monthly Payments & Interest">
    <meta property="og:description" content="Free loan calculator with amortization schedule. Calculate monthly payments, total interest, and payment breakdown.">
    <meta property="og:image" content="https://sheekovic.github.io/images/sheeko.jpg">
    <meta property="og:site_name" content="Sheekovic Tools">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://sheekovic.github.io/loan-calculator.html">
    <meta property="twitter:title" content="Free Loan Calculator">
    <meta property="twitter:description" content="Free loan calculator with amortization schedule. Calculate monthly payments and total interest.">
    <meta property="twitter:image" content="https://sheekovic.github.io/images/sheeko.jpg">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Loan Calculator",
      "description": "Free online loan calculator with amortization schedule. Calculate monthly payments, interest, and total cost.",
      "url": "https://sheekovic.github.io/loan-calculator.html",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sheekovic"
      }
    }
    </script>
    
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/tools/loan-calculator.css">
</head>
<body>
    <div class="container">
        <h1>💰 Loan Calculator</h1>
        
        <div class="input-group">
            <label>Loan Amount ($):</label>
            <input type="number" id="loanAmount" placeholder="100000" step="1000">
        </div>
        
        <div class="input-group">
            <label>Interest Rate (% per year):</label>
            <input type="number" id="interestRate" placeholder="5.5" step="0.1">
        </div>
        
        <div class="input-group">
            <label>Loan Term:</label>
            <input type="number" id="loanTerm" placeholder="30" step="1">
        </div>
        
        <div class="input-group">
            <label>Term Period:</label>
            <select id="termPeriod">
                <option value="months">Months</option>
                <option value="years" selected>Years</option>
            </select>
        </div>
        
        <button onclick="calculate()">Calculate</button>
        
        <div class="results" id="results">
            <div class="result-main">
                <div class="result-main-value" id="monthlyPayment">$0.00</div>
                <div class="result-main-label">Monthly Payment</div>
            </div>
            
            <div class="result-item">
                <span class="result-label">Total Payment:</span>
                <span class="result-value" id="totalPayment">$0.00</span>
            </div>
            <div class="result-item">
                <span class="result-label">Total Interest:</span>
                <span class="result-value" id="totalInterest">$0.00</span>
            </div>
            <div class="result-item">
                <span class="result-label">Principal Amount:</span>
                <span class="result-value" id="principalAmount">$0.00</span>
            </div>
            <div class="result-item">
                <span class="result-label">Number of Payments:</span>
                <span class="result-value" id="numPayments">0</span>
            </div>
        </div>
        
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/loan-calculator.js"></script>
</body>
</html>
