    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Text to Speech",
      "description": "Free online text to speech converter. Convert text to voice with customizable speed, pitch, and voice selection.",
      "url": "https://sheekovic.github.io/text-to-speech.html",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sheekovic"
      }
    }
    </script>
    
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/tools/text-to-speech.css">
</head>
<body>
    <div class="container">
        <h1>🔊 Text to Speech</h1>
        
        <div class="info">
            <strong>Tip:</strong> Uses your browser's built-in Text-to-Speech engine. 
            Voice availability depends on your browser and operating system.
        </div>
        
        <textarea id="textInput" placeholder="Enter text here to convert to speech...">Hello! Welcome to the Text to Speech tool. This tool uses your browser's speech synthesis to read text aloud.</textarea>
        
        <div class="controls">
            <div class="input-group">
                <label>Voice:</label>
                <select id="voiceSelect"></select>
            </div>
            
            <div class="input-group">
                <label>Language:</label>
                <select id="langSelect">
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (UK)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="ko-KR">Korean</option>
                    <option value="zh-CN">Chinese</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Speed: <span class="value-display" id="rateValue">1.0x</span></label>
                <div class="slider-container">
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" oninput="updateRate()">
                </div>
            </div>
            
            <div class="input-group">
                <label>Pitch: <span class="value-display" id="pitchValue">1.0</span></label>
                <div class="slider-container">
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1" oninput="updatePitch()">
                </div>
            </div>
        </div>
        
        <div class="status" id="status">Ready</div>
        
        <div class="button-group">
            <button onclick="speak()">▶️ Speak</button>
            <button class="pause" onclick="pauseResume()" id="pauseBtn">⏸️ Pause</button>
            <button class="stop" onclick="stop()">⏹️ Stop</button>
        </div>
        
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/text-to-speech.js"></script>
</body>
</html>
