<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile — Sheekovic Lab</title>
  <meta name="description" content="View the account currently signed in to Sheekovic Lab.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/favicon.ico">
</head>
<body>
  <main class="account-page">
    <section id="profile" aria-labelledby="profile-title">
      <header>
        <p class="eyebrow"><span></span> Account</p>
        <h1 id="profile-title">Your profile</h1>
        <p>Account details are loaded from Firebase only after you sign in.</p>
      </header>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Profile picture</th><th>Name</th><th>Email</th></tr></thead>
          <tbody id="user-profile-table"><tr><td colspan="3">Checking sign-in status…</td></tr></tbody>
        </table>
      </div>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </section>
  </main>
  <script type="module" src="/assets/js/profile.js"></script>
</body>
</html>
