    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Regex Tester",
      "description": "Free online regular expression tester and debugger with live match highlighting.",
      "url": "https://sheekovic.github.io/regex-tester.html",
      "applicationCategory": "DeveloperApplication",

</head>
<body>
    <div class="container">
        <h1>🔍 RegEx Tester</h1>
        
        <div class="input-group">
            <label>Regular Expression:</label>
            <input type="text" id="regex" placeholder="^\w+@\w+\.\w+$" oninput="testRegex()">
        </div>
        
        <div class="input-group">
            <label>Flags:</label>
            <div class="flags">
                <div class="flag-item">
                    <input type="checkbox" id="flag-g" checked onchange="testRegex()">
                    <label for="flag-g">g (global)</label>
                </div>
                <div class="flag-item">
                    <input type="checkbox" id="flag-i" onchange="testRegex()">
                    <label for="flag-i">i (case insensitive)</label>
                </div>
                <div class="flag-item">
                    <input type="checkbox" id="flag-m" onchange="testRegex()">
                    <label for="flag-m">m (multiline)</label>
                </div>
                <div class="flag-item">
                    <input type="checkbox" id="flag-s" onchange="testRegex()">
                    <label for="flag-s">s (dotAll)</label>
                </div>
            </div>
        </div>
        
        <div class="input-group">
            <label>Test String:</label>
            <textarea id="testString" placeholder="Enter text to test against the regex...">email@example.com
test@test.org
invalid-email
another@domain.co.uk</textarea>
        </div>
        
        <div class="results" id="results"></div>
        
        <button onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/regex-tester.js"></script>
</body>
