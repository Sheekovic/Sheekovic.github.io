<body>
    <div class="container">
        <h1>✨ Code Beautifier</h1>
        
        <div class="language-tabs">
            <button class="lang-tab active" data-language="javascript" onclick="switchLang('javascript')">JavaScript</button>
            <button class="lang-tab" data-language="html" onclick="switchLang('html')">HTML</button>
            <button class="lang-tab" data-language="css" onclick="switchLang('css')">CSS</button>
            <button class="lang-tab" data-language="json" onclick="switchLang('json')">JSON</button>
        </div>
        
        <div class="editor-container">
            <div class="editor-section">
                <label>Input Code:</label>
                <textarea id="input" placeholder="Paste your code here..."></textarea>
            </div>
            <div class="editor-section">
                <label>Formatted Output:</label>
                <textarea id="output" readonly></textarea>
            </div>
        </div>
        
        <div class="button-group">
            <button onclick="beautify()">Beautify Code</button>
            <button onclick="minify()">Minify Code</button>
            <button class="secondary" onclick="copyOutput()">Copy Output</button>
            <button class="secondary" onclick="clearAll()">Clear All</button>
            <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
        </div>
    </div>
