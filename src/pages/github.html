<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Projects — Sheekovic Lab</title>
  <meta name="description" content="Browse Sheekovic's public GitHub profile and repositories, or look up another public GitHub account.">
  <meta name="author" content="Ahmed F. Wahballah">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sheekovic.github.io/github.html">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/assets/css/repos.css">
</head>
<body>
  <main class="repos-page">
    <section class="repos-hero" aria-labelledby="user-repos">
      <p class="eyebrow"><span></span> GitHub explorer</p>
      <h1 id="user-repos">Public projects</h1>
      <p>Browse my repositories or enter another GitHub username. Data is loaded directly from GitHub's public API.</p>
      <form id="repo-search" role="search">
        <label class="sr-only" for="usernameInput">GitHub username</label>
        <input type="search" id="usernameInput" value="Sheekovic" placeholder="GitHub username" autocomplete="off">
        <button type="submit">Load profile</button>
      </form>
    </section>
    <section id="user-info" class="github-user" aria-live="polite"><p>Loading user info…</p></section>
    <section class="github-repos" id="github-repos" aria-label="Repositories" aria-live="polite"><p>Loading repositories…</p></section>
  </main>
  <script src="/assets/js/repos.js"></script>
</body>
</html>
