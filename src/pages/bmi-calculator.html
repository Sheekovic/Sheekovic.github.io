    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BMI Calculator",
      "description": "Free online Body Mass Index (BMI) calculator. Calculate BMI with health category assessment.",
      "url": "https://sheekovic.github.io/bmi-calculator.html",
      "applicationCategory": "HealthApplication",
      "offers": {

</head>
<body>
    <div class="container">
        <h1>⚕️ BMI Calculator</h1>
        
        <div class="units-toggle">
            <button class="unit-btn active" onclick="switchUnits('metric')">Metric (kg/cm)</button>
            <button class="unit-btn" onclick="switchUnits('imperial')">Imperial (lb/in)</button>
        </div>
        
        <div id="metric-inputs">
            <div class="input-group">
                <label>Weight (kg):</label>
                <input type="number" id="weightKg" placeholder="70" step="0.1">
            </div>
            <div class="input-group">
                <label>Height (cm):</label>
                <input type="number" id="heightCm" placeholder="170" step="0.1">
            </div>
        </div>
        
        <div id="imperial-inputs" style="display: none;">
            <div class="input-group">
                <label>Weight (lbs):</label>
                <input type="number" id="weightLbs" placeholder="154" step="0.1">
            </div>
            <div class="input-group">
                <label>Height (inches):</label>
                <input type="number" id="heightIn" placeholder="67" step="0.1">
            </div>
        </div>
        
        <button onclick="calculateBMI()">Calculate BMI</button>
        
        <div class="result" id="result">
            <div class="bmi-value" id="bmiValue">-</div>
            <div class="bmi-category" id="bmiCategory">-</div>
            <div class="bmi-description" id="bmiDescription">-</div>
        </div>
        
        <div class="bmi-chart">
            <h3 style="margin-bottom: 15px; color: #333;">BMI Categories:</h3>
            <div class="chart-item underweight">
                <span>Underweight</span>
                <span>&lt; 18.5</span>
            </div>
            <div class="chart-item normal">
                <span>Normal Weight</span>
                <span>18.5 - 24.9</span>
            </div>
            <div class="chart-item overweight">
                <span>Overweight</span>
                <span>25.0 - 29.9</span>
            </div>
            <div class="chart-item obese">
                <span>Obese</span>
                <span>≥ 30.0</span>
            </div>
        </div>
        
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/bmi-calculator.js"></script>
</body>
</html>
