    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Color Converter",
      "description": "Free online color converter. Convert between HEX, RGB, HSL, and CMYK color formats with color picker.",

<body>
    <div class="container">
        <h1>🎨 Color Converter</h1>
        
        <div class="color-preview" id="colorPreview"></div>
        
        <div class="input-group">
            <label>Color Picker:</label>
            <input type="color" id="colorPicker" value="#3498db" oninput="updateFromPicker()">
        </div>
        
        <div class="input-group">
            <label>HEX:</label>
            <input type="text" id="hexInput" value="#3498db" oninput="updateFromHex()">
        </div>
        
        <div class="input-group">
            <label>RGB:</label>
            <div class="rgb-inputs">
                <input type="number" id="r" min="0" max="255" placeholder="R" oninput="updateFromRGB()">
                <input type="number" id="g" min="0" max="255" placeholder="G" oninput="updateFromRGB()">
                <input type="number" id="b" min="0" max="255" placeholder="B" oninput="updateFromRGB()">
            </div>
        </div>
        
        <div class="input-group">
            <label>HSL:</label>
            <div class="hsl-inputs">
                <input type="number" id="h" min="0" max="360" placeholder="H" oninput="updateFromHSL()">
                <input type="number" id="s" min="0" max="100" placeholder="S%" oninput="updateFromHSL()">
                <input type="number" id="l" min="0" max="100" placeholder="L%" oninput="updateFromHSL()">
            </div>
        </div>
        
        <div class="color-formats">
            <h3 style="margin-bottom: 15px; color: #333;">All Formats (Click to Copy):</h3>
            <div class="format-item" onclick="copyFormat('hex')">
                <span class="format-label">HEX:</span>
                <span class="format-value" id="hexValue">#3498db</span>
            </div>
            <div class="format-item" onclick="copyFormat('rgb')">
                <span class="format-label">RGB:</span>
                <span class="format-value" id="rgbValue">rgb(52, 152, 219)</span>
            </div>
            <div class="format-item" onclick="copyFormat('hsl')">
                <span class="format-label">HSL:</span>
                <span class="format-value" id="hslValue">hsl(204, 70%, 53%)</span>
            </div>
            <div class="format-item" onclick="copyFormat('cmyk')">
                <span class="format-label">CMYK:</span>
                <span class="format-value" id="cmykValue">cmyk(76%, 31%, 0%, 14%)</span>
            </div>
        </div>
        
        <button onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/color-converter.js"></script>
</body>
