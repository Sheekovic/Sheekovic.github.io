<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Unit Converter - Length, Weight, Temperature, Area, Volume | Sheekovic</title>
    <meta name="description" content="Free online unit converter. Convert length, weight, temperature, area, and volume units instantly. Supports metric and imperial units. Accurate conversion calculator.">
    <meta name="keywords" content="unit converter, convert units, length converter, weight converter, temperature converter, metric converter, imperial converter, measurement converter">
    <meta name="author" content="Sheekovic">
    <meta name="robots" content="index, follow">

    <meta property="twitter:card" content="summary_large_image">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Unit Converter",
      "description": "Free online unit converter for length, weight, temperature, area, and volume measurements.",
      "url": "https://sheekovic.github.io/unit-converter.html",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sheekovic"
      }
    }
    </script>
    
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/tools/unit-converter.css">
</head>
<body>
    <div class="container">
        <h1>📏 Unit Converter</h1>
        
        <div class="category-tabs">
            <button class="tab active" onclick="switchCategory('length')">Length</button>
            <button class="tab" onclick="switchCategory('weight')">Weight</button>
            <button class="tab" onclick="switchCategory('temperature')">Temperature</button>
            <button class="tab" onclick="switchCategory('area')">Area</button>
            <button class="tab" onclick="switchCategory('volume')">Volume</button>
        </div>
        
        <div id="length" class="converter-section active">
            <div class="input-group">
                <label>Value:</label>
                <input type="number" id="lengthValue" oninput="convertLength()" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label>From:</label>
                <select id="lengthFrom" onchange="convertLength()">
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="cm">Centimeters</option>
                    <option value="mm">Millimeters</option>
                    <option value="mi">Miles</option>
                    <option value="yd">Yards</option>
                    <option value="ft">Feet</option>
                    <option value="in">Inches</option>
                </select>
            </div>
            <div class="input-group">
                <label>To:</label>
                <select id="lengthTo" onchange="convertLength()">
                    <option value="m">Meters</option>
                    <option value="km">Kilometers</option>
                    <option value="cm">Centimeters</option>
                    <option value="mm">Millimeters</option>
                    <option value="mi">Miles</option>
                    <option value="yd">Yards</option>
                    <option value="ft" selected>Feet</option>
                    <option value="in">Inches</option>
                </select>
            </div>
            <div class="result" id="lengthResult">-</div>
        </div>
        
        <div id="weight" class="converter-section">
            <div class="input-group">
                <label>Value:</label>
                <input type="number" id="weightValue" oninput="convertWeight()" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label>From:</label>
                <select id="weightFrom" onchange="convertWeight()">
                    <option value="kg">Kilograms</option>
                    <option value="g">Grams</option>
                    <option value="mg">Milligrams</option>
                    <option value="lb">Pounds</option>
                    <option value="oz">Ounces</option>
                    <option value="ton">Metric Tons</option>
                </select>
            </div>
            <div class="input-group">
                <label>To:</label>
                <select id="weightTo" onchange="convertWeight()">
                    <option value="kg">Kilograms</option>
                    <option value="g">Grams</option>
                    <option value="mg">Milligrams</option>
                    <option value="lb" selected>Pounds</option>
                    <option value="oz">Ounces</option>
                    <option value="ton">Metric Tons</option>
                </select>
            </div>
            <div class="result" id="weightResult">-</div>
        </div>
        
        <div id="temperature" class="converter-section">
            <div class="input-group">
                <label>Value:</label>
                <input type="number" id="tempValue" oninput="convertTemp()" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label>From:</label>
                <select id="tempFrom" onchange="convertTemp()">
                    <option value="c">Celsius</option>
                    <option value="f">Fahrenheit</option>
                    <option value="k">Kelvin</option>
                </select>
            </div>
            <div class="input-group">
                <label>To:</label>
                <select id="tempTo" onchange="convertTemp()">
                    <option value="c">Celsius</option>
                    <option value="f" selected>Fahrenheit</option>
                    <option value="k">Kelvin</option>
                </select>
            </div>
            <div class="result" id="tempResult">-</div>
        </div>
        
        <div id="area" class="converter-section">
            <div class="input-group">
                <label>Value:</label>
                <input type="number" id="areaValue" oninput="convertArea()" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label>From:</label>
                <select id="areaFrom" onchange="convertArea()">
                    <option value="sqm">Square Meters</option>
                    <option value="sqkm">Square Kilometers</option>
                    <option value="sqft">Square Feet</option>
                    <option value="sqmi">Square Miles</option>
                    <option value="acre">Acres</option>
                    <option value="hectare">Hectares</option>
                </select>
            </div>
            <div class="input-group">
                <label>To:</label>
                <select id="areaTo" onchange="convertArea()">
                    <option value="sqm">Square Meters</option>
                    <option value="sqkm">Square Kilometers</option>
                    <option value="sqft" selected>Square Feet</option>
                    <option value="sqmi">Square Miles</option>
                    <option value="acre">Acres</option>
                    <option value="hectare">Hectares</option>
                </select>
            </div>
            <div class="result" id="areaResult">-</div>
        </div>
        
        <div id="volume" class="converter-section">
            <div class="input-group">
                <label>Value:</label>
                <input type="number" id="volumeValue" oninput="convertVolume()" placeholder="Enter value">
            </div>
            <div class="input-group">
                <label>From:</label>
                <select id="volumeFrom" onchange="convertVolume()">
                    <option value="l">Liters</option>
                    <option value="ml">Milliliters</option>
                    <option value="gal">Gallons (US)</option>
                    <option value="qt">Quarts</option>
                    <option value="pt">Pints</option>
                    <option value="cup">Cups</option>
                    <option value="tbsp">Tablespoons</option>
                    <option value="tsp">Teaspoons</option>
                </select>
            </div>
            <div class="input-group">
                <label>To:</label>
                <select id="volumeTo" onchange="convertVolume()">
                    <option value="l">Liters</option>
                    <option value="ml">Milliliters</option>
                    <option value="gal" selected>Gallons (US)</option>
                    <option value="qt">Quarts</option>
                    <option value="pt">Pints</option>
                    <option value="cup">Cups</option>
                    <option value="tbsp">Tablespoons</option>
                    <option value="tsp">Teaspoons</option>
                </select>
            </div>
            <div class="result" id="volumeResult">-</div>
        </div>
        
        <button onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/unit-converter.js"></script>
</body>
</html>
