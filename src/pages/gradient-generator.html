    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CSS Gradient Generator",
      "description": "Free online CSS gradient generator. Create and customize linear and radial gradients with visual editor.",
      "url": "https://sheekovic.github.io/gradient-generator.html",
      "applicationCategory": "DesignApplication",
      "offers": {

<body>
    <div class="container">
        <h1>🎨 CSS Gradient Generator</h1>
        
        <div class="preview" id="preview"></div>
        
        <div class="controls">
            <div class="input-group">
                <label>Gradient Type:</label>
                <select id="gradientType" onchange="updateGradient()">
                    <option value="linear">Linear</option>
                    <option value="radial">Radial</option>
                </select>
            </div>
            
            <div class="input-group" id="angleGroup">
                <label>Angle: <span id="angleValue">90</span>°</label>
                <input type="range" id="angle" min="0" max="360" value="90" oninput="updateGradient()">
            </div>
            
            <div class="color-stops">
                <h3 style="margin-bottom: 15px;">Color Stops:</h3>
                <div id="colorStopsList"></div>
                <button class="add-btn" onclick="addColorStop()">+ Add Color Stop</button>
            </div>
        </div>
        
        <div class="code-output" onclick="copyCode()" title="Click to copy">
            <div id="cssCode">background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);</div>
        </div>
        
        <button onclick="copyCode()">Copy CSS Code</button>
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
