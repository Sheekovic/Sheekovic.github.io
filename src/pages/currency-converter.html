<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Currency Converter - Convert USD, EUR, GBP, BTC & 70+ Currencies | Sheekovic</title>
    <meta name="description" content="Free currency converter with 70+ currencies. Convert between major fiat currencies and cryptocurrencies. Real-time exchange rates with 1-hour cache. Supports USD, EUR, BTC, ETH and more.">
    <meta name="keywords" content="currency converter, crypto converter, bitcoin converter, exchange rate, convert currency, usd to eur, btc to usd, currency calculator, forex converter, cryptocurrency converter">
    <meta name="author" content="Sheekovic">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sheekovic.github.io/currency-converter.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sheekovic.github.io/currency-converter.html">
    <meta property="og:title" content="Free Currency Converter - Convert 70+ Currencies & Crypto">
    <meta property="og:description" content="Free currency converter with 70+ currencies. Convert between major fiat currencies and cryptocurrencies with real-time rates.">
    <meta property="og:image" content="https://sheekovic.github.io/images/sheeko.jpg">
    <meta property="og:site_name" content="Sheekovic Tools">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://sheekovic.github.io/currency-converter.html">
    <meta property="twitter:title" content="Free Currency & Crypto Converter">
    <meta property="twitter:description" content="Convert 70+ currencies including Bitcoin, Ethereum, USD, EUR with real-time exchange rates.">
    <meta property="twitter:image" content="https://sheekovic.github.io/images/sheeko.jpg">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Currency & Cryptocurrency Converter",
      "description": "Free online currency converter with 70+ currencies. Convert between fiat and cryptocurrencies with real-time exchange rates.",
      "url": "https://sheekovic.github.io/currency-converter.html",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sheekovic"
      }
    }
    </script>
    
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/tools/currency-converter.css">
</head>
<body>
    <div class="container">
        <h1>💱 Currency Converter</h1>
        
        <div id="statusMessage"></div>
        
        <div class="input-group">
            <label>Amount:</label>
            <input type="number" id="amount" value="1" min="0" step="any" oninput="convert()">
        </div>
        
        <div class="input-group">
            <label>From:</label>
            <div class="search-box">
                <input type="text" id="fromSearch" placeholder="Search currency..." oninput="filterCurrencies('from')">
                <span class="search-icon">🔍</span>
            </div>
            <select id="fromCurrency" size="8" onchange="convert()"></select>
        </div>
        
        <button class="swap-btn" onclick="swapCurrencies()">⇅ Swap Currencies</button>
        
        <div class="input-group">
            <label>To:</label>
            <div class="search-box">
                <input type="text" id="toSearch" placeholder="Search currency..." oninput="filterCurrencies('to')">
                <span class="search-icon">🔍</span>
            </div>
            <select id="toCurrency" size="8" onchange="convert()"></select>
        </div>
        
        <div class="result">
            <div class="result-amount" id="result">Loading...</div>
            <div class="result-info" id="rate">Fetching exchange rates...</div>
        </div>
        
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/currency-converter.js"></script>
</body>
</html>
