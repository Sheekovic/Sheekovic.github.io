<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcrossBoard - Sign In</title>
    <link rel="stylesheet" href="/assets/css/acrossboard/login.css">
    <script type="module" src="/assets/js/acrossboard/auth.js"></script>
    <link rel="icon" type="image/x-icon" href="acrossboard.ico">
</head>
<body>
    <div class="login-container">
        <h2>Sign In to AcrossBoard</h2>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="email-login">Sign In</button>
        <hr>
        <button id="google-login">Sign In with Google</button>
        <button id="github-login">Sign In with GitHub</button>
    </div>
    
</body>
</html>
