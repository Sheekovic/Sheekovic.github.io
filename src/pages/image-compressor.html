<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Free online image compressor. Compress and reduce image file sizes without losing quality. Supports JPG, PNG, and more. Adjust quality slider and download instantly.">
    <meta name="keywords" content="image compressor, compress image, reduce image size, image optimizer, shrink image, image compression, optimize image, compress jpg, compress png">
    <meta name="author" content="Sheekovic">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sheekovic.github.io/image-compressor.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sheekovic.github.io/image-compressor.html">
    <meta property="og:title" content="Free Image Compressor - Reduce Image Size Online">
    <meta property="og:description" content="Free online image compressor. Compress and reduce image file sizes without losing quality. Supports JPG, PNG, and more.">
    <meta property="og:image" content="https://sheekovic.github.io/images/sheeko.jpg">
    <meta property="og:site_name" content="Sheekovic Tools">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://sheekovic.github.io/image-compressor.html">
    <meta property="twitter:title" content="Free Image Compressor">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Image Compressor",
      "description": "Free online image compression tool. Reduce image file sizes while maintaining quality.",
      "url": "https://sheekovic.github.io/image-compressor.html",
      "applicationCategory": "MultimediaApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Sheekovic"
      }
    }
    </script>
    
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/assets/css/tools/image-compressor.css">
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Compressor</h1>
        
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📤</div>
            <h3>Click or Drag & Drop Image</h3>
            <p style="color: #999; margin-top: 10px;">Supports JPG, PNG, WebP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div class="quality-control hidden" id="controls">
            <label style="display: block; margin-bottom: 8px; color: #555; font-weight: 600;">
                Compression Quality:
            </label>
            <div class="slider-container">
                <input type="range" id="quality" min="1" max="100" value="80" oninput="updateCompression()">
                <span class="value-display" id="qualityValue">80%</span>
            </div>
        </div>
        
        <div class="preview-container hidden" id="preview">
            <div class="preview-box">
                <h3>Original</h3>
                <img id="originalImg" alt="Original">
                <div class="file-info" id="originalInfo">-</div>
            </div>
            <div class="preview-box">
                <h3>Compressed</h3>
                <img id="compressedImg" alt="Compressed">
                <div class="file-info" id="compressedInfo">-</div>
            </div>
        </div>
        
        <button id="downloadBtn" class="hidden" onclick="downloadImage()">Download Compressed Image</button>
        <button class="secondary" onclick="location.href='tools.html'">← Back to Tools</button>
    </div>
    <script src="/assets/js/tools/image-compressor.js"></script>
</body>
</html>
