<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Age Calculator — Sheekovic Lab</title>
  <meta name="description" content="Calculate an exact calendar age, total days lived, and time until the next birthday in your browser.">
  <meta name="author" content="Ahmed F. Wahballah">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sheekovic.github.io/age.html">
  <link rel="icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/assets/css/age.css">
</head>
<body>
  <main id="main" class="age-page">
    <section class="age-intro" aria-labelledby="age-title">
      <p class="eyebrow"><span></span> Private, browser-based calculation</p>
      <h1 id="age-title">Age Calculator</h1>
      <p>Choose a birth date to see an exact calendar age, total days lived, and the countdown to the next birthday. The date never leaves your browser.</p>
    </section>

    <section class="age-card" aria-label="Age calculation">
      <form id="age-form">
        <label for="birth-date">Date of birth</label>
        <input type="date" id="birth-date" required>
        <button type="submit">Calculate age</button>
        <p id="age-error" class="age-error" role="alert" hidden></p>
      </form>

      <div id="age-results" class="age-results" aria-live="polite" hidden>
        <div class="age-result-grid">
          <article><strong id="age-years">0</strong><span>years</span></article>
          <article><strong id="age-months">0</strong><span>months</span></article>
          <article><strong id="age-days">0</strong><span>days</span></article>
        </div>
        <dl class="age-details">
          <div><dt>Total days lived</dt><dd id="age-total-days">0</dd></div>
          <div><dt>Next birthday</dt><dd id="age-next-birthday">—</dd></div>
        </dl>
      </div>
    </section>
  </main>
  <script src="/assets/js/AgeCalculator.js"></script>
</body>
</html>
